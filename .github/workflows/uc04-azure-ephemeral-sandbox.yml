name: uc04-azure-ephemeral-sandbox

on:
  workflow_dispatch:
    inputs:
      storage_account_name:
        description: "Azure Storage account name for Terraform state"
        required: true
      sandbox_id:
        description: "Sandbox identifier (e.g., sbx01)"
        required: true
      notification_emails:
        description: "JSON list of email addresses for budget alerts"
        required: true
      location:
        description: "Azure region for resources"
        required: false
        default: "westus2"

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prove identity
        run: |
          az account show --query '{subscription:id, tenant:tenantId, user:user.name}' -o jsonc
          echo "ARM_* environment variables should be empty when using azure/login with OIDC:"
          env | sort | rg '^ARM_' || true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Write backend config
        run: |
          cat <<EOF > backend/azure-uc04-ephemeral-sandbox.hcl
          resource_group_name  = "mcsa-tfstate-rg"
          storage_account_name = "${{ inputs.storage_account_name }}"
          container_name       = "tfstate"
          key                  = "uc04/azure/ephemeral-sandbox.tfstate"
          use_azuread_auth     = true
          EOF

      - name: Terraform Init
        working-directory: use-cases/04-ephemeral-sandbox/azure/terraform/root
        run: terraform init -reconfigure -backend-config=../../../../../backend/azure-uc04-ephemeral-sandbox.hcl

      - name: Terraform Plan
        working-directory: use-cases/04-ephemeral-sandbox/azure/terraform/root
        run: |
          export ARM_SUBSCRIPTION_ID="${{ vars.AZURE_SUBSCRIPTION_ID }}"
          cat <<EOF > /tmp/uc04.auto.tfvars.json
          {
            "sandbox_id": "${{ inputs.sandbox_id }}",
            "notification_emails": ${{ inputs.notification_emails }},
            "location": "${{ inputs.location }}"
          }
          EOF
          terraform plan -var-file=/tmp/uc04.auto.tfvars.json
