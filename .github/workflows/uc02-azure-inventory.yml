name: uc02-azure-inventory

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    env:
      OUT_DIR: out
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prove identity
        run: |
          az account show --query '{subscription:id, tenant:tenantId, user:user.name}' -o jsonc
          echo "ARM_* environment variables should be empty when using azure/login with OIDC:"
          env | sort | rg '^ARM_' || true

      - name: Generate inventory
        run: bash use-cases/02-inventory-auto-doc/azure/scripts/discover.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uc02-azure-inventory
          path: |
            out/inventory.json
            out/SUMMARY.md
            out/artifacts/**
